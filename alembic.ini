# Конфигурация Alembic. Команды запускаются из корня проекта: `alembic upgrade head`.

[alembic]
script_location = %(here)s/migrations
# Корень проекта в sys.path: env.py импортирует `app`.
prepend_sys_path = .
path_separator = os
# URL базы здесь не задаётся: env.py берёт его из настроек приложения (`DATABASE_URL` или `.env`).
# Тесты передают свой URL через `sqlalchemy.url`.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
